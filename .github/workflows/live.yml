name: SereneBabySounds

on:
  workflow_dispatch:
  schedule:
    # বাংলাদেশ সকাল ৬টা (00:00 UTC) - দুপুর ১২টা পর্যন্ত
    - cron: '0 0 * * *'
    # বাংলাদেশ সন্ধ্যা ৬টা (12:00 UTC) - রাত ১২টা পর্যন্ত
    - cron: '0 12 * * *'

concurrency:
  group: youtube-live-stable
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-noto-core
          pip3 install --break-system-packages --upgrade gdown yt-dlp || pip3 install --upgrade gdown yt-dlp

      - name: Download Video
        env:
          VIDEO_URL: ${{ secrets.VIDEO_URL }}
        run: |
          if echo "$VIDEO_URL" | grep -q "drive.google"; then
            FILEID=$(echo "$VIDEO_URL" | grep -oE 'id=[^&]+' | cut -d= -f2)
            [ -z "$FILEID" ] && FILEID=$(echo "$VIDEO_URL" | grep -oE '/d/[^/]+' | cut -d'/' -f3)
            gdown "https://drive.google.com/uc?id=$FILEID" -O video.mp4
          else
            yt-dlp -o video.mp4 "$VIDEO_URL" || curl -L -o video.mp4 "$VIDEO_URL"
          fi
          ls -lh video.mp4

      - name: Start Stream (Only LIVE Badge)
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          PROBE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 video.mp4)
          W=$(echo $PROBE | cut -d',' -f1); H2=$(echo $PROBE | cut -d',' -f2)
          if [ -z "$W" ]; then W=1280; H2=720; fi
          if [ "$H2" -gt "$W" ]; then OUT_W=720; OUT_H=1280; LIVE_Y=70; echo "Vertical Detected"; else OUT_W=1280; OUT_H=720; LIVE_Y=22; echo "Horizontal Detected"; fi
          LIVE_Y2=$((LIVE_Y+6))
          HAS_AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 video.mp4 | wc -l)
          if [ "$HAS_AUDIO" -eq 0 ]; then
            A_IN="-f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100"
            A_MAP="-map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -maxrate 2500k -bufsize 5000k -g 60 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest"
          else
            A_IN=""
            A_MAP="-c:v libx264 -preset veryfast -maxrate 2500k -bufsize 5000k -g 60 -pix_fmt yuv420p -c:a aac -b:a 128k"
          fi
          cat > /tmp/f.txt <<'ENDOFFILTER'
          scale=OUTW:OUTH:force_original_aspect_ratio=decrease,pad=OUTW:OUTH:(ow-iw)/2:(oh-ih)/2:color=black,drawbox=x=18:y=__LIVEY__:w=86:h=34:color=red@1:t=fill,drawtext=fontfile=FONTFILE:text='LIVE':x=28:y=__LIVEY2__:fontcolor=white:fontsize=20
          ENDOFFILTER
          sed -i "s|__LIVEY2__|$LIVE_Y2|g; s|__LIVEY__|$LIVE_Y|g; s|OUTW|$OUT_W|g; s|OUTH|$OUT_H|g; s|FONTFILE|$FONT|g" /tmp/f.txt
          cat /tmp/f.txt
          ffmpeg -re -stream_loop -1 -i video.mp4 $A_IN -vf "$(cat /tmp/f.txt)" $A_MAP -t 350 -f flv rtmp://a.rtmp.youtube.com/live2/$YT_KEY
          echo "Streaming session completed. Releasing endpoint..."
          sleep 90
