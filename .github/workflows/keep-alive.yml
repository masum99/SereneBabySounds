name: Keep Alive

on:
  schedule:
    # প্রতি ৫০ দিনে একবার commit করবে (৬০ দিন আগেই)
    - cron: '0 0 */50 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Keep-alive ping: $(date -u)" >> keep-alive.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keep-alive.log
          git commit -m "keep-alive: prevent schedule disable" || echo "No changes"
          git push
